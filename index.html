<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscador de guías se mudó · Provefabrica</title>
<meta name="robots" content="noindex">
<noscript><meta http-equiv="refresh" content="0;url=https://distribucionpepf-provefabrica.github.io/BuscadorGuias/"></noscript>
<style>
:root{--bg:#16181c;--papel:#1f2228;--tinta:#f1f3f5;--suave:#a9b1bb;--rojo:#E1001A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tinta);font:16px/1.5 "Segoe UI",Roboto,Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
.c{max-width:440px;width:100%;background:var(--papel);border-top:4px solid var(--rojo);border-radius:12px;padding:26px 24px}
h1{margin:0 0 6px;font-size:22px}
p{margin:0 0 16px;color:var(--suave)}
a.b{display:block;text-align:center;background:var(--rojo);color:#fff;text-decoration:none;font-weight:700;padding:13px 16px;border-radius:9px}
small{display:block;margin-top:14px;color:var(--suave);word-break:break-all}
</style></head>
<body><div class="c">
<h1>Buscador de guías cambió de dirección</h1>
<p>Ahora está en la cuenta de Provefabrica. Te llevamos en un momento; si no pasa nada, toca el botón.</p>
<a class="b" id="ir" href="https://distribucionpepf-provefabrica.github.io/BuscadorGuias/">Abrir Buscador de guías</a>
<small>Guarda la dirección nueva: https://distribucionpepf-provefabrica.github.io/BuscadorGuias/</small>
</div>
<script>
/* Redirección a la cuenta de GitHub de la empresa. Conserva la ruta, los parámetros y el #
   (por ejemplo los enlaces de acceso del Buscador). Si este navegador tenía ajustes que solo
   vivían aquí, viajan en el enlace (#traslado=…) y la app nueva los guarda una sola vez. */
(function(){
  var NUEVO='https://distribucionpepf-provefabrica.github.io';
  var LLEVAR=["ubg_recientes", "ubg_lista", "ubg_lista_hechas", "ubg_formato"];
  var hash=location.hash;
  if(!hash&&LLEVAR.length){
    var o={},n=0;
    LLEVAR.forEach(function(k){try{var v=localStorage.getItem(k);if(v!==null){o[k]=v;n++;}}catch(e){}});
    if(n){try{hash='#traslado='+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){}}
  }
  var destino=NUEVO+location.pathname+location.search+hash;
  document.getElementById('ir').href=destino;
  var ido=false;function ir(){if(ido)return;ido=true;location.replace(destino);}
  /* la app vieja guardada en el celular (para abrir sin señal) se borra: así el ícono no la vuelve a abrir */
  try{if('caches' in window)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}catch(e){}
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}).then(ir,ir);
      setTimeout(ir,1500);
    }else ir();
  }catch(e){ir();}
})();
</script>
</body></html>
